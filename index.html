<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Tic Tac Toe</h1>
    </header>
    <div style="align-items: center; justify-content: center; display: flex;">
        <h2>Your turn</h2>
    </div>
    <div class="player_turn">
        <h2 id="player_turn_x" class="turn">X</h2>
        <h2 id="player_turn_o" class="turn">O</h2>
    </div>
    <div class="score_area">
        <h3>Player Score:</h3>
        <div class="player_score">
            <h3>X = <span id="score_player_x">0</span></h3>
            <h3>O = <span id="score_player_o">0</span></h3>
        </div>
    </div>
    <div class="board">
        <div class="row_1">
            <button id="cell_1"></button>
            <button id="cell_2"></button>
            <button id="cell_3"></button>
        </div>
        <div class="row_2">
            <button id="cell_4"></button>
            <button id="cell_5"></button>
            <button id="cell_6"></button>
        </div>
        <div class="row_3">
            <button id="cell_7"></button>
            <button id="cell_8"></button>
            <button id="cell_9"></button>
        </div>
    </div>
    <div class="restart_game">
        <button id="restart_game">Play again</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
